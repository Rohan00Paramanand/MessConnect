<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Under Maintenance | PCET MessConnect</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 40% 20%, hsla(28,100%,74%,0.15) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189,100%,56%,0.18) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355,100%,93%,0.2) 0px, transparent 50%),
        radial-gradient(at 80% 50%, hsla(340,100%,76%,0.12) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(22,100%,77%,0.15) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(242,100%,70%,0.15) 0px, transparent 50%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 32px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07), 0 0 1px rgba(0, 0, 0, 0.1);
      max-width: 540px;
      width: 100%;
      padding: 44px 36px;
      text-align: center;
      position: relative;
      z-index: 10;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }

    .logo-ring {
      position: absolute;
      inset: -8px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(8, 111, 100, 0.25), rgba(20, 184, 166, 0.1));
      animation: pulse 2.5s infinite ease-in-out;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .logo-img {
      position: relative;
      z-index: 1;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 12px 24px -6px rgba(8, 111, 100, 0.25);
      border: 2px solid white;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #0f172a;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    p.desc {
      font-size: 14.5px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 500;
    }

    .btn-retry {
      width: 100%;
      padding: 14px 20px;
      background: #086f64;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(8, 111, 100, 0.25);
    }

    .btn-retry:hover {
      background: #06544c;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(8, 111, 100, 0.35);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .footer-note {
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
      margin-top: 20px;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img src="/pcet.png" alt="PCET Logo" class="logo-img" onerror="this.style.display='none'" />
    </div>

    <div>
      <div class="badge">
        <span class="badge-dot"></span>
        Upgrading System
      </div>
    </div>

    <h1>Site Under Maintenance</h1>
    <p class="desc">
      We are currently deploying updates to PCET MessConnect to bring you a smoother and faster experience. Please hold on — this will only take a moment!
    </p>

    <button id="retryBtn" class="btn-retry" onclick="checkServerHealth()">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">Check Connection Now</span>
    </button>

    <p class="footer-note">
      PCET MessConnect • Pimpri Chinchwad Education Trust
    </p>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    // Live ping function
    async function checkServerHealth() {
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = 'Checking...';
      retryBtn.disabled = true;

      try {
        const res = await fetch('/api/health', { method: 'GET', cache: 'no-store' });
        if (res.ok) {
          btnText.innerText = 'Connected! Loading...';
          // Server is back! Reload back to main app
          window.location.href = '/';
          return;
        }
      } catch (err) {
        // Still down, keep waiting
      }

      setTimeout(() => {
        btnSpinner.style.display = 'none';
        btnText.innerText = 'Check Connection Now';
        retryBtn.disabled = false;
      }, 700);
    }
  </script>
</body>
</html>
