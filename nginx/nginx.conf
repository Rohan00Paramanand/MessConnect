events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream backend_api {
        server backend:5000;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Direct error fallback for 502/503/504
        error_page 502 503 504 /maintenance.html;

        location = /maintenance.html {
            root /usr/share/nginx/html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend_api;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Intercept errors when backend container is down or recomposing
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_maintenance;
        }

        location @api_maintenance {
            default_type application/json;
            return 503 '{"status":"maintenance","message":"System is currently updating. Please check back shortly."}';
        }

        location /uploads/ {
            proxy_pass http://backend_api;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fallback for image requests during container recomposition
            proxy_intercept_errors on;
            error_page 502 503 504 = @api_maintenance;
        }
    }
}

